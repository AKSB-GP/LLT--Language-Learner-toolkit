<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <!-- Editorial Header -->
  <div class="header-title">LLT - LANGUAGE LEARNER TOOLKIT</div>
  <!-- Section 01: Offline Piper TTS -->
  <div class="section-item">
    <div class="section-header"
      title="PIPER is a natural language text-to-speech function: Audio is more natural but might occasionally pronounce incorrectly.">
      <span class="section-num">01 / </span>
      <span class="section-title">PIPER TEXT-TO-SPEECH</span>
    </div>

    <div class="form-group">
      <label for="language-category" title="Available languages for PIPER Text-to-speech.">LANGUAGE CATEGORY</label>
      <select id="language-category" title="Select a language.">
        <option value="russian">RUSSIAN</option>
        <option value="english">ENGLISH</option>
        <option value="swedish">SWEDISH</option>
      </select>
    </div>

    <div class="form-group">
      <label for="piper-voice" title="Available voices for PIPER text-to-speech.">VOICE MODEL</label>
      <select id="piper-voice" title="Select a voice.">
        <!-- populated dynamically -->
      </select>
    </div>

    <div class="form-group">
      <label for="piper-speed" title="Speed settings for PIPER text-to-speech.">
        <span title="Change the speed of PIPER speech. Higher value gives faster speech.">SPEECH SPEED</span>
        <span id="piper-speed-val" class="val-display">1.0x</span>
      </label>
      <input type="range" id="piper-speed" min="0.5" max="2.0" step="0.1" value="1.0" />
    </div>

    <div class="form-group">
      <label for="piper-noise-scale" title="Voice variation settings for PIPER text-to-speech.">
        <span title="Change the voice variation of PIPER text-to-speech. Higher value gives more variation.">VOICE
          VARIATION</span>
        <span id="piper-noise-scale-val" class="val-display">0.67</span>
      </label>
      <input type="range" id="piper-noise-scale" min="0.1" max="1.5" step="0.05" value="0.67" />
    </div>

    <div class="form-group">
      <label for="piper-noise-w" title="Rhythm and emotion settings for PIPER text-to-speech.">
        <span
          title="Change the rhythm and emotion of PIPER speech. Higher value gives more rhythm and emotion. Lower gives more monotone voice.">RHYTHM
          &amp; EMOTION</span>
        <span id="piper-noise-w-val" class="val-display">0.80</span>
      </label>
      <input type="range" id="piper-noise-w" min="0.1" max="1.5" step="0.05" value="0.80" />
    </div>
  </div>

  <!-- Section 02: Google TTS -->
  <div class="section-item">
    <div class="section-header"
      title="Google text-to-speech: Google translate can be used for audio. It is faster and and pronounces more correctly but is more robotic.">
      <span class="section-num">02 /</span>
      <span class="section-title">GOOGLE SETTINGS</span>
    </div>

    <div class="form-group" title="Available languages for google text-to-speech.">
      <label for="google-language">LANGUAGE FOR TEXT-TO-SPEECH</label>
      <select id="google-language" title="Select a language for Google text-to-speech.">
        <option value="ru-RU">RUSSIAN</option>
        <option value="en-US">ENGLISH</option>
        <option value="sv-SE">SWEDISH</option>
      </select>
    </div>

    <div class="form-group">
      <label for="google-rate" title="Speed seetings for google text-to-speech.">
        <span title="Affects the speed of speech. Higher value is faster">SPEECH SPEED
        </span>
        <span id="google-rate-val" class="val-display">1.0x</span>
      </label>
      <input type="range" id="google-rate" min="0.5" max="2.5" step="0.1" value="1.0" />
    </div>

    <div class="form-group" title="Target language which google translate should translate to. ">
      <label for="google-translate-target-language">TRANSLATION TARGET</label>
      <select id="google-translate-target-language"
        title="Select language which google translate should translate to. if same target language is same as selected text, you will be prompted to select an language.">
        <option value="en">ENGLISH</option>
        <option value="sv">SWEDISH</option>
        <option value="ru">RUSSIAN</option>
      </select>
    </div>
  </div>
  <!-- Section 03: Wiktionary Lookup Mode -->

    <div class="section-header" title="IDENTIFICATION METHOD SETTINGS">

    </div>
     TODO: Implement automatic identifiaction when it is better

          AUTOMATIC WORD IDENTIFICATION
        </option>
      </select>
    </div> -->
  </div>

  <!-- Section 04: Vocabulary Export & Storage -->
  <div class="section-item">
    <div class="section-header" title="Vocabulary export settings">
      <span class="section-num">03 / </span>
      <span class="section-title">EXPORT</span>
    </div>

    <div class="form-group">
      <label class="form-label" for="export-language-select">EXPORT LANGUAGE FILTER</label>
      <select id="export-language-select" class="form-select" title="Select which saved words to export by language.">
        <option value="all">ALL LANGUAGES</option>
        <option value="russian">RUSSIAN</option>
        <option value="swedish">SWEDISH</option>
        <option value="english">ENGLISH</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label" for="export-language-target-select">TRANSLATION TARGET </label>
      <select id="export-language-target-select" class="form-select"
        title="Select the target language which the saved words should be translated to. ">
        <option value="en">ENGLISH</option>
        <option value="sv">SWEDISH</option>
        <option value="ru">RUSSIAN</option>
      </select>
    </div>
    <div class="form-group">
      <!-- TODO: IMPLEMENT .txt EXPORT -->
      <!--       <button class="data-control-btn" id="export-csv-btn" type="button" title="Export Anki-compatible TSV/TXT file">
        EXPORT ANKI (.TXT)
      </button> -->

      <button class="data-control-btn" id="export-apkg-btn" type="button"
        title="Export your saved words as an ANKI deck.">
        EXPORT SAVED WORDS
      </button>
    </div>
  </div>
  <!-- Section 05: Data Settings -->
  <div class="section-item">
    <div class="section-header" title="App data settings">
      <span class="section-num">04 / </span>
      <span class="section-title">DATA SETTINGS</span>
    </div>

    <div class="form-group">
      <button class="data-control-btn" id="clear-audio-cache-btn" type="button"
        title="Clear cached TTS audio recordings to free up space in the browser. Use if you feel the page is running slowly.">
        CLEAR AUDIO CACHE
      </button>

      <button class="data-control-btn" id="clear-vocab-btn" type="button"
        title="Clear all saved vocabulary records. WARNING: This action cannot be undone.">
        CLEAR VOCABULARY
      </button>
    </div>
  </div>
  <!-- Auto-save notification -->
  <div id="status" class="status-toast">
    <span>SAVED</span>
  </div>
  <script src="dist/popup.js"></script>
</body>

</html>
